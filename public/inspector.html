<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>extrravenue — Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --primary: #7b68c8;
  --grad: linear-gradient(135deg,#c94baa 0%,#7b68c8 55%,#2ca6d4 100%);
  --bg: #f0f0f5;
  --surface: #fff;
  --border: #d8d8e4;
  --text:  #12122a;
  --text2: #3a3a56;
  --text3: #7070a0;
  --success: #16a34a;
  --danger:  #dc2626;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 16px rgba(0,0,0,.10);
  --header-h: 56px;
  --toolbar-h: 54px;
  --nav-h: 60px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* ── AUTH ───────────────────────────────────────────────────────── */
#auth-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: var(--bg);
}
.auth-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 40px 32px;
  width: 100%; max-width: 420px;
  box-shadow: 0 8px 40px rgba(123,104,200,.13), 0 2px 8px rgba(0,0,0,.06);
  animation: slideUp .3s ease;
}
@keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo-brand {
  font-family: 'Magra', sans-serif;
  font-weight: 700;
  font-size: 28px;
  letter-spacing: -.01em;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: inline-block;
}
.auth-logo-sub {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  margin-top: 4px;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.auth-divider {
  width: 40px; height: 3px;
  background: var(--grad);
  border-radius: 2px;
  margin: 10px auto 0;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text3);
  margin-bottom: 7px;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(123,104,200,.13);
}
.form-group { margin-bottom: 16px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .01em;
}
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 2px 10px rgba(123,104,200,.3); }
.btn-primary:hover { opacity: .9; box-shadow: 0 4px 16px rgba(123,104,200,.4); }
.btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-full { width: 100%; justify-content: center; }
.error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; padding: 10px 12px; background: #fee2e2; border-radius: 8px; }

/* ── APP SHELL ──────────────────────────────────────────────────── */
#app-screen { display: none; }

/* Fixed header */
.app-header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px;
  justify-content: space-between;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.header-brand {
  font-family: 'Magra', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -.01em;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-user { text-align: right; }
.header-user-name { display: block; font-size: 13px; font-weight: 600; color: var(--text2); }
.header-user-role { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }

/* Fixed toolbar */
.toolbar {
  position: fixed;
  top: var(--header-h);
  left: 0; right: 0;
  height: var(--toolbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  padding: 0 14px;
  z-index: 99;
}
.search-input {
  flex: 1;
  padding: 9px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: var(--bg);
  color: var(--text);
  transition: border-color .15s;
  min-width: 0;
}
.search-input:focus { border-color: var(--primary); background: var(--surface); }
.filter-select {
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text2);
  outline: none;
  flex-shrink: 0;
}
.btn-add {
  flex-shrink: 0;
  background: var(--grad);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}

/* Scrollable leads area */
.leads-container {
  position: fixed;
  top: calc(var(--header-h) + var(--toolbar-h));
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px 16px;
}

/* Lead cards */
.lead-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 15px 14px;
  margin-bottom: 10px;
  box-shadow: 0 1px 6px rgba(0,0,0,.07);
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .12s, box-shadow .12s;
}
.lead-card:active { border-color: var(--primary); box-shadow: 0 2px 12px rgba(123,104,200,.15); }
.lead-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.lead-biz { font-weight: 700; font-size: 16px; color: var(--text); line-height: 1.2; }
.lead-owner { font-size: 13px; color: var(--text3); margin-top: 3px; }
.lead-meta { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
.lead-meta-item { font-size: 13px; color: var(--text2); font-weight: 500; }

/* Badges */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-yellow  { background: #fef9c3; color: #713f12; }
.badge-blue    { background: #dbeafe; color: #1e3a8a; }
.badge-green   { background: #dcfce7; color: #14532d; }
.badge-red     { background: #fee2e2; color: #7f1d1d; }
.badge-teal    { background: #ccfbf1; color: #134e4a; }
.badge-gray    { background: #f1f5f9; color: #334155; }
.badge-purple  { background: #ede9fe; color: #3b0764; }

/* ── DRAWER ─────────────────────────────────────────────────────── */
.drawer-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,10,30,.45);
  z-index: 200; display: none;
  backdrop-filter: blur(2px);
}
.drawer {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  z-index: 201;
  max-height: 92vh;
  display: none; flex-direction: column;
}
.drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
.drawer-header {
  padding: 12px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.drawer-title { font-size: 17px; font-weight: 700; color: var(--text); }
.drawer-close { font-size: 22px; color: var(--text3); cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 6px; }
.drawer-close:hover { background: var(--bg); }
.drawer-body { overflow-y: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }

.section-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--text3);
  margin-bottom: 8px; margin-top: 18px;
}
.section-label:first-child { margin-top: 0; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-item label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); display: block; margin-bottom: 2px; }
.info-item p { font-size: 14px; font-weight: 500; color: var(--text); }

.status-select {
  width: 100%; padding: 11px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit;
  background: var(--bg); color: var(--text);
  outline: none;
}
.status-select:focus { border-color: var(--primary); }

/* Activity */
.activity-item { border-left: 2px solid var(--border); padding: 6px 12px; margin-bottom: 10px; }
.activity-time { font-size: 11px; color: var(--text3); }
.activity-type { font-size: 13px; font-weight: 600; color: var(--text2); margin-top: 2px; }
.activity-note { font-size: 13px; color: var(--text2); margin-top: 2px; }
.activity-status { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* Photos */
.photos-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.photo-thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-del { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.65); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.photo-add {
  aspect-ratio: 1; border-radius: 10px;
  border: 2px dashed var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; color: var(--text3);
  font-size: 12px; gap: 5px;
  background: var(--bg); transition: border-color .15s;
}
.photo-add:hover { border-color: var(--primary); color: var(--primary); }

/* Note */
.note-input {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit;
  resize: vertical; min-height: 80px;
  background: var(--bg); color: var(--text); outline: none;
}
.note-input:focus { border-color: var(--primary); background: var(--surface); }

/* ── BOTTOM NAV ─────────────────────────────────────────────────── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px 4px;
  font-size: 11px; font-weight: 600;
  color: var(--text3); cursor: pointer;
  border: none; background: none; gap: 3px;
  transition: color .15s; font-family: inherit;
  text-transform: uppercase; letter-spacing: .04em;
}
.nav-btn.active { color: var(--primary); }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; }

/* ── TOAST ──────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: calc(var(--nav-h) + 12px);
  left: 50%; transform: translateX(-50%);
  background: #12122a; color: #fff;
  padding: 11px 22px; border-radius: 22px;
  font-size: 14px; font-weight: 500;
  z-index: 999; opacity: 0;
  transition: opacity .25s; pointer-events: none;
  white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
#toast.show { opacity: 1; }

/* ── MODAL SHEET ────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,10,30,.45);
  z-index: 300; display: none; align-items: flex-end;
  backdrop-filter: blur(2px);
}
.modal-backdrop.open { display: flex; }
.modal-sheet {
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  width: 100%; max-height: 92vh;
  overflow-y: auto;
  padding: 20px 16px 32px;
}
.modal-sheet-title {
  font-size: 17px; font-weight: 700;
  color: var(--text);
  margin-bottom: 18px;
}

/* ── UTILS ──────────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 52px 24px; color: var(--text3); }
.empty-state svg { width: 52px; height: 52px; margin-bottom: 14px; opacity: .35; }
.empty-state p { font-size: 15px; }

.spinner {
  width: 34px; height: 34px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 48px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Agreement print */
#agreement-print {
  display: none;
  position: fixed; inset: 0; z-index: 500;
  background: #fff; overflow-y: auto;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
}
@media print {
  body > *:not(#agreement-print) { display: none !important; }
  #agreement-print { display: block !important; position: static; padding: 20px; }
}

/* Desktop tweaks */
@media (min-width: 600px) {
  .leads-container { max-width: 680px; left: 50%; right: auto; transform: translateX(-50%); width: 100%; }
  .toolbar { max-width: 680px; left: 50%; right: auto; transform: translateX(-50%); border-radius: 0 0 12px 12px; }
  .app-header { padding: 0 calc(50% - 340px); }
  .modal-sheet { max-width: 480px; margin: 0 auto; border-radius: 22px; }
  .modal-backdrop { align-items: center; }
  .drawer { max-width: 480px; left: 50%; transform: translateX(-50%); border-radius: 22px; bottom: 0; }
  .bottom-nav { max-width: 680px; left: 50%; right: auto; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
}
</style>
</head>
<body>
<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="37" height="40" viewBox="0 0 37 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="height:48px;width:auto;display:block;margin:0 auto 10px;"><defs><linearGradient id="evLgL" x1="0" y1="0" x2="20.64" y2="41.28" gradientUnits="userSpaceOnUse"><stop stop-color="#D44A9A"/><stop offset="1" stop-color="#1D91D3"/></linearGradient></defs><path fill="url(#evLgL)" d="M22.7902 23.8891L22.7891 23.8881L22.495 23.8939L24.8744 27.9076C29.9747 27.1687 33.9869 23.3658 34.8234 18.571L29.891 18.6711C29.0116 21.6254 26.1874 23.8199 22.7902 23.8891Z"/><path fill="url(#evLgL)" d="M19.3377 22.6215L19.331 22.6082C22.1529 22.3409 24.6852 21.1377 26.5791 19.3297C28.7264 17.2805 30.0539 14.4535 30.0539 11.3315C30.0539 11.1356 30.0489 10.9476 30.0406 10.7682H30.0378C29.7292 4.77186 24.5189 0 18.1352 0H0L2.34425 4.15641H17.6988C21.8661 4.15641 25.2449 7.36889 25.2449 11.3315C25.2449 15.2941 21.8655 18.5066 17.6977 18.5066L10.3714 18.6008L12.6057 22.6646L22.2322 39.8881H28.9591L19.3377 22.6215Z"/><path fill="url(#evLgL)" d="M22.736 14.3246C23.0898 13.3184 23.2985 12.2488 23.3404 11.1388C23.3454 11.0025 23.3488 10.8662 23.3488 10.7288C23.3488 10.575 23.3454 10.4259 23.3404 10.2822V10.1666H5.67788L7.99701 14.3241L22.736 14.3246Z"/><path fill="url(#evLgL)" d="M32.5528 10.1672C32.5544 10.205 32.5561 10.2438 32.5572 10.2827V11.1393C32.5159 12.2494 32.3067 13.3189 31.9529 14.3252H36.2619V10.1677L32.5528 10.1672Z"/></svg>
      <span class="auth-logo-brand">extrravenue</span>
      <span class="auth-logo-sub" id="auth-sub-title">Inspector Portal</span>
      <div class="auth-divider"></div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="login-view">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="your@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" id="login-password" class="form-input" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="padding-right:44px;">
          <button type="button" onclick="togglePassVis('login-password','eye-login')" tabindex="-1" style="position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;">
            <svg id="eye-login" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="login-error" class="error-msg"></div>
      <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()" style="margin-top:6px;padding:14px;">Sign In</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="showForgotView();return false;" style="font-size:13px;color:#7b68c8;text-decoration:none;">Forgot password?</a>
      </div>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div id="forgot-view" style="display:none;">
      <p style="font-size:13px;color:#888;margin:0 0 18px;line-height:1.5;">Apna registered email dalo — hum ek reset link bhejenge.</p>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="forgot-email" class="form-input" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doForgotPassword()">
      </div>
      <div id="forgot-msg" style="font-size:13px;margin-bottom:12px;display:none;padding:10px 12px;border-radius:8px;"></div>
      <button class="btn btn-primary btn-full" id="forgot-btn" onclick="doForgotPassword()" style="padding:14px;">Reset Link Bhejo</button>
      <div style="text-align:center;margin-top:10px;">
        <a href="#" onclick="showLoginView();return false;" style="font-size:13px;color:#888;text-decoration:none;">< Back to Login</a>
      </div>
    </div>

    <!-- RESET PASSWORD VIEW -->
    <div id="reset-view" style="display:none;">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div style="position:relative;">
          <input type="password" id="reset-pass" class="form-input" placeholder="Min 8 characters" autocomplete="new-password" style="padding-right:44px;">
          <button type="button" onclick="togglePassVis('reset-pass','eye-reset1')" tabindex="-1" style="position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;">
            <svg id="eye-reset1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative;">
          <input type="password" id="reset-pass2" class="form-input" placeholder="Same password again" autocomplete="new-password" style="padding-right:44px;">
          <button type="button" onclick="togglePassVis('reset-pass2','eye-reset2')" tabindex="-1" style="position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;">
            <svg id="eye-reset2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="reset-msg" style="font-size:13px;margin-bottom:12px;display:none;padding:10px 12px;border-radius:8px;"></div>
      <button class="btn btn-primary btn-full" id="reset-btn" onclick="doResetPassword()" style="padding:14px;">Password Save Karo</button>
    </div>

  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">

  <div class="app-header">

<!-- AGREEMENT PRINT -->
<div id="agreement-print"></div>
<div id="toast"></div>

<script>
const API = 'https://www.extrravenue.com/api';
let token = null, currentUser = null, _allLeads = [], _currentLeadId = null;

const STATUS_LABELS = {
  new:'New', assigned:'Assigned', contacted:'Contacted',
  meeting_scheduled:'Meeting Scheduled', meeting_done:'Meeting Done',
  site_visited:'Site Visited', site_rejected:'Site Rejected',
  agreement_pending:'Agreement Pending', agreement_signed:'Agreement Signed',
  installation_pending:'Install Pending', installation_done:'Install Done',
  live:'Live', dropped:'Dropped'
};
const STATUS_BADGE = {
  new:'badge-yellow', assigned:'badge-blue', contacted:'badge-blue',
  meeting_scheduled:'badge-purple', meeting_done:'badge-purple',
  site_visited:'badge-teal', agreement_pending:'badge-blue',
  agreement_signed:'badge-teal', installation_pending:'badge-blue',
  installation_done:'badge-teal', live:'badge-green',
  dropped:'badge-red', site_rejected:'badge-red'
};
const CAT_LABELS = {
  gym:'Gym', restaurant:'Restaurant', cafe:'Cafe', salon:'Salon',
  clinic:'Clinic', retail:'Retail', hotel:'Hotel', society:'Society',
  office:'Office', education:'Education', other:'Other'
};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='error' ? '#991b1b' : type==='success' ? 'linear-gradient(135deg,#c94baa 0%,#7b68c8 55%,#2ca6d4 100%)' : 'linear-gradient(135deg,#c94baa 0%,#7b68c8 55%,#2ca6d4 100%)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(path, opts={}) {
  const isFormData = opts.body instanceof FormData;
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      ...(opts.headers||{}),
      ...(!isFormData ? {'Content-Type':'application/json'} : {}),
      Authorization: `Bearer ${token}`
    }
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || data.message || 'Error');
  return data;
}

// ── FORGOT / RESET PASSWORD ───────────────────────────────────────
function togglePassVis(inputId, iconId) {
  const inp = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  icon.innerHTML = isHidden
    ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M1 1l22 22"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}
function showLoginView() {
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('forgot-view').style.display = 'none';
  document.getElementById('reset-view').style.display = 'none';
  document.getElementById('auth-sub-title').textContent = 'Inspector Portal';
}
function showForgotView() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('forgot-view').style.display = 'block';
  document.getElementById('reset-view').style.display = 'none';
  document.getElementById('auth-sub-title').textContent = 'Password Reset';
  const emailVal = document.getElementById('login-email').value.trim();
  if (emailVal) document.getElementById('forgot-email').value = emailVal;
  document.getElementById('forgot-msg').style.display = 'none';
  document.getElementById('forgot-btn').style.display = '';
}
async function doForgotPassword() {
  const email = document.getElementById('forgot-email').value.trim();
  const msgEl = document.getElementById('forgot-msg');
  const btn = document.getElementById('forgot-btn');
  if (!email) { msgEl.textContent='Email required hai'; msgEl.style.background='#fee2e2'; msgEl.style.color='#dc2626'; msgEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await fetch(`${API}/auth/forgot-password`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    msgEl.textContent = '✓ Reset link bhej diya! Email check karo (spam folder bhi).';
    msgEl.style.background='#dcfce7'; msgEl.style.color='#15803d'; msgEl.style.display='block';
    btn.style.display = 'none';
  } catch(e) {
    msgEl.textContent = 'Kuch error hua. Dobara try karo.';
    msgEl.style.background='#fee2e2'; msgEl.style.color='#dc2626'; msgEl.style.display='block';
    btn.disabled = false; btn.textContent = 'Reset Link Bhejo';
  }
}
let _resetToken = null;
function checkResetToken() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('reset');
  if (!t) return;
  _resetToken = t;
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('forgot-view').style.display = 'none';
  document.getElementById('reset-view').style.display = 'block';
  document.getElementById('auth-sub-title').textContent = 'New Password Set Karo';
}
async function doResetPassword() {
  const pass = document.getElementById('reset-pass').value;
  const pass2 = document.getElementById('reset-pass2').value;
  const msgEl = document.getElementById('reset-msg');
  const btn = document.getElementById('reset-btn');
  msgEl.style.display = 'none';
  if (pass.length < 8) { msgEl.textContent='Minimum 8 characters chahiye'; msgEl.style.background='#fee2e2'; msgEl.style.color='#dc2626'; msgEl.style.display='block'; return; }
  if (pass !== pass2) { msgEl.textContent='Dono passwords match nahi kar rahe'; msgEl.style.background='#fee2e2'; msgEl.style.color='#dc2626'; msgEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token: _resetToken, new_password: pass})
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Reset failed');
    msgEl.textContent = '✓ ' + d.message;
    msgEl.style.background='#dcfce7'; msgEl.style.color='#15803d'; msgEl.style.display='block';
    btn.style.display = 'none';
    setTimeout(() => { history.replaceState({}, '', '/inspector.html'); showLoginView(); }, 2000);
  } catch(e) {
    msgEl.textContent = e.message; msgEl.style.background='#fee2e2'; msgEl.style.color='#dc2626'; msgEl.style.display='block';
    btn.disabled = false; btn.textContent = 'Password Save Karo';
  }
}

// ── AUTH ──────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Email aur password required'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch(`${API}/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (!['venue_inspector','admin','superadmin'].includes(data.user?.role)) {
      throw new Error('Access denied. Inspector credentials required.');
    }
    token = data.token; currentUser = data.user;
    try { localStorage.setItem('insp_token', token); localStorage.setItem('insp_user', JSON.stringify(currentUser)); } catch(e){}
    startApp();
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

checkResetToken();

function doLogout() {
  token = null; currentUser = null;
  try { localStorage.removeItem('insp_token'); localStorage.removeItem('insp_user'); } catch(e){}
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('hdr-name').textContent = currentUser.name || currentUser.email;
  loadLeads();
}

// Auto-login
(function(){
  try {
    const t = localStorage.getItem('insp_token');
    const u = JSON.parse(localStorage.getItem('insp_user')||'null');
    if (t && u && ['venue_inspector','admin','superadmin'].includes(u.role)) {
      token = t; currentUser = u; startApp();
    }
  } catch(e){}
})();

// ── LEADS ─────────────────────────────────────────────────────────
async function loadLeads() {
  document.getElementById('leads-list').innerHTML = '<div class="spinner"></div>';
  try {
    _allLeads = await api('/leads');
    filterLeads();
  } catch(e) {
    document.getElementById('leads-list').innerHTML = `<div class="empty-state"><p>Failed to load: ${esc(e.message)}</p></div>`;
  }
}

function filterLeads() {
  const q = document.getElementById('leads-search').value.toLowerCase();
  const status = document.getElementById('leads-filter').value;
  const filtered = _allLeads.filter(l =>
    (!q || (l.business_name||'').toLowerCase().includes(q) || (l.phone||'').includes(q) || (l.owner_name||'').toLowerCase().includes(q)) &&
    (!status || l.status === status)
  );
  const list = document.getElementById('leads-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>No leads found</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(l => `
    <div class="lead-card" onclick="openDrawer('${l.id}')">
      <div class="lead-card-top">
        <div style="min-width:0;flex:1;">
          <div class="lead-biz">${esc(l.business_name)}</div>
          ${l.owner_name ? `<div class="lead-owner">${esc(l.owner_name)}</div>` : ''}
        </div>
        <span class="badge ${STATUS_BADGE[l.status]||'badge-gray'}">${STATUS_LABELS[l.status]||l.status}</span>
      </div>
      <div class="lead-meta">
        <div class="lead-meta-item">${esc(l.phone)}</div>
        ${l.city ? `<div class="lead-meta-item">📍 ${esc(l.city)}</div>` : ''}
        ${l.venue_category ? `<div class="lead-meta-item">${CAT_LABELS[l.venue_category]||l.venue_category}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ── DRAWER ────────────────────────────────────────────────────────
async function openDrawer(id) {
  _currentLeadId = id;
  document.getElementById('drawer-backdrop').style.display = 'block';
  const dr = document.getElementById('lead-drawer');
  dr.style.display = 'flex';
  document.getElementById('drawer-body').innerHTML = '<div class="spinner"></div>';
  try {
    const l = await api(`/leads/${id}`);
    document.getElementById('drawer-title').textContent = l.business_name;
    const photos = l.photos || [];
    const photoHtml = `
      <div class="photos-grid" id="photos-grid">
        ${photos.map((p,i) => `
          <div class="photo-thumb">
            <img src="${esc(p.url)}" loading="lazy" onclick="viewPhoto('${esc(p.url)}')">
            <button class="photo-del" onclick="deletePhoto(${i})">×</button>
          </div>`).join('')}
        ${photos.length < 7 ? `
          <label class="photo-add" for="photo-upload-input">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add Photo
          </label>` : ''}
      </div>
      <input type="file" id="photo-upload-input" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(this)">
    `;
    const activities = (l.activities||[]).map(a => `
      <div class="activity-item">
        <div class="activity-time">${new Date(a.created_at).toLocaleString('en-IN')}</div>
        <div class="activity-type">${(a.activity_type||'').replace(/_/g,' ')}</div>
        ${a.old_status&&a.new_status ? `<div class="activity-status">${STATUS_LABELS[a.old_status]||a.old_status} → ${STATUS_LABELS[a.new_status]||a.new_status}</div>` : ''}
        ${a.note ? `<div class="activity-note">${esc(a.note)}</div>` : ''}
      </div>`).join('') || '<div style="color:var(--text3);font-size:13px;">No activity yet</div>';

    document.getElementById('drawer-body').innerHTML = `
      <div class="info-grid">
        <div class="info-item"><label>Phone</label><p>${esc(l.phone)}</p></div>
        <div class="info-item"><label>City</label><p>${esc(l.city||'—')}</p></div>
        <div class="info-item"><label>Category</label><p>${CAT_LABELS[l.venue_category]||l.venue_category||'—'}</p></div>
        <div class="info-item"><label>Footfall</label><p>${l.footfall_estimate||'—'}/day</p></div>
        <div class="info-item"><label>Screens</label><p>${l.screen_count||0}</p></div>
        <div class="info-item"><label>Source</label><p style="text-transform:capitalize;">${(l.source||'—').replace(/_/g,' ')}</p></div>
      </div>

      <div class="section-label">Status</div>
      <select class="status-select" id="drawer-status" onchange="updateStatus('${l.id}', this.value)">
        ${Object.entries(STATUS_LABELS).map(([v,t]) => `<option value="${v}" ${l.status===v?'selected':''}>${t}</option>`).join('')}
      </select>
      ${['installation_done','live'].includes(l.status) ? `
      <button class="btn btn-primary" style="width:100%;margin-top:12px;padding:13px;justify-content:center;font-size:14px;" onclick="openVPModal('${l.id}')">
        🔑 Venue Partner Login Banao
      </button>` : ''}

      <div class="section-label">Site Photos (${photos.length}/7)</div>
      ${photoHtml}

      <div class="section-label">Add Note</div>
      <textarea class="note-input" id="drawer-note" placeholder="Call log, meeting notes, observations…"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-primary" style="flex:1;padding:12px;" onclick="saveNote('${l.id}')">Save Note</button>
        <button class="btn btn-ghost" style="flex:1;padding:12px;" onclick="generateAgreement('${l.id}')">📄 Agreement</button>
      </div>

      <div class="section-label">Activity Log</div>
      ${activities}
      <div style="height:16px;"></div>
    `;
  } catch(e) {
    document.getElementById('drawer-body').innerHTML = `<div style="color:var(--danger);text-align:center;padding:28px;">${esc(e.message)}</div>`;
  }
}

function closeDrawer() {
  document.getElementById('drawer-backdrop').style.display = 'none';
  document.getElementById('lead-drawer').style.display = 'none';
  _currentLeadId = null;
}

async function updateStatus(id, status) {
  try {
    await api(`/leads/${id}`, {method:'PATCH', body:JSON.stringify({status})});
    showToast('Status updated', 'success');
    loadLeads();
  } catch(e) { showToast(e.message, 'error'); }
}

async function saveNote(id) {
  const note = document.getElementById('drawer-note').value.trim();
  if (!note) return;
  try {
    await api(`/leads/${id}/activity`, {method:'POST', body:JSON.stringify({activity_type:'note', note})});
    showToast('Note saved', 'success');
    openDrawer(id);
  } catch(e) { showToast(e.message, 'error'); }
}

// ── PHOTOS ────────────────────────────────────────────────────────
async function uploadPhoto(input) {
  if (!input.files[0] || !_currentLeadId) return;
  const fd = new FormData();
  fd.append('photo', input.files[0]);
  showToast('Uploading…');
  try {
    await api(`/leads/${_currentLeadId}/photos`, {method:'POST', body:fd});
    showToast('Photo uploaded!', 'success');
    openDrawer(_currentLeadId);
  } catch(e) { showToast(e.message, 'error'); }
}

async function deletePhoto(idx) {
  if (!_currentLeadId || !confirm('Delete this photo?')) return;
  try {
    await api(`/leads/${_currentLeadId}/photos/${idx}`, {method:'DELETE'});
    showToast('Photo deleted', 'success');
    openDrawer(_currentLeadId);
  } catch(e) { showToast(e.message, 'error'); }
}

function viewPhoto(url) { window.open(url, '_blank'); }

// ── NEW LEAD ──────────────────────────────────────────────────────
function openNewLead() { document.getElementById('new-lead-modal').classList.add('open'); }
function closeNewLead() { document.getElementById('new-lead-modal').classList.remove('open'); }

async function saveNewLead() {
  const btn = document.getElementById('nl-save-btn');
  const business_name = document.getElementById('nl-biz').value.trim();
  const phone = document.getElementById('nl-phone').value.trim();
  if (!business_name || !phone) { showToast('Business name aur phone required', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('/leads', {method:'POST', body:JSON.stringify({
      business_name,
      owner_name: document.getElementById('nl-owner').value.trim() || undefined,
      phone,
      city: document.getElementById('nl-city').value.trim() || undefined,
      venue_category: document.getElementById('nl-cat').value,
      footfall_estimate: document.getElementById('nl-footfall').value || undefined,
      screen_count: document.getElementById('nl-screens').value || 1,
      notes: document.getElementById('nl-notes').value.trim() || undefined,
      source: 'field_visit'
    })});
    showToast('Lead created!', 'success');
    closeNewLead();
    ['nl-biz','nl-owner','nl-phone','nl-city','nl-footfall','nl-notes'].forEach(id => document.getElementById(id).value = '');
    loadLeads();
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Create Lead'; }
}

// ── AGREEMENT ─────────────────────────────────────────────────────
let _agrPrintHtml = '';

function _agrStyles() {
  return `<style>
    body { font-family: 'Times New Roman', serif; max-width: 750px; margin: 0 auto; padding: 40px 48px; color: #111; line-height: 1.7; font-size: 13pt; }
    h1 { text-align: center; font-size: 16pt; margin-bottom: 6px; }
    .sub { text-align: center; font-size: 11pt; color: #555; margin-bottom: 32px; }
    h2 { font-size: 13pt; margin-top: 24px; margin-bottom: 6px; }
    p { margin-bottom: 10px; text-align: justify; }
    .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; }
    .sig-box p { border-top: 1px solid #333; margin-top: 48px; padding-top: 6px; font-size: 11pt; }
    @media print { .no-print { display: none !important; } }
  </style>`;
}

function openAgreementWindow() {
  const w = window.open('', '_blank');
  if (w) {
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Venue Partner Agreement</title>${_agrStyles()}</head><body>${_agrPrintHtml}</body></html>`);
    w.document.close();
    setTimeout(() => { try { w.print(); } catch(e) {} }, 400);
  } else {
    window.print();
  }
}

async function generateAgreement(id) {
  try {
    const l = await api(`/leads/${id}`);
    const today = l.agreement_date
      ? new Date(l.agreement_date).toLocaleDateString('en-IN', {day:'2-digit', month:'long', year:'numeric'})
      : new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'long', year:'numeric'});
    const isLocked = l.status === 'agreement_signed';

    _agrPrintHtml = `
      <h1>Venue Partner Agreement${isLocked ? ' <span style="font-size:12pt;background:#e6f4ea;color:#1a7f37;padding:2px 10px;border-radius:4px;vertical-align:middle;">✓ Signed</span>' : ''}</h1>
      <div class="sub">Digital Signage Network Participation Agreement</div>
      <p>This Agreement is entered into as of <strong>${today}</strong>, between <strong>extrravenue</strong> (hereinafter <strong>"Company"</strong>), AND <strong>${esc(l.owner_name||'[Owner Name]')}</strong>, operating <strong>${esc(l.business_name)}</strong> located at <strong>${esc(l.city||'[City]')}</strong> (hereinafter <strong>"Venue Partner"</strong>).</p>
      <h2>1. Screen &amp; Installation</h2>
      <p>extrravenue shall connect the digital screen at the Venue Partner's premises to its CMS. If a new screen is required, cost and ownership shall be mutually agreed in writing. extrravenue retains ownership of its media player hardware installed at the premises.</p>
      <h2>2. Content Slot Allocation</h2>
      <p><strong>Venue Content:</strong> The Venue Partner is entitled to display their own promotional content during all available Filler Slots — screen time not occupied by paid advertiser content. <strong>Priority:</strong> Paid third-party advertiser content takes absolute scheduling priority.</p>
      <h2>3. Utilities</h2>
      <p>The Venue Partner shall bear all costs for electricity and internet connectivity at their premises required to operate the screen and media player.</p>
      <h2>4. Content Guidelines</h2>
      <p>The Venue Partner shall ensure all uploaded content complies with applicable Indian laws. extrravenue reserves the right to remove violating content without notice.</p>
      <h2>5. Monetary Terms</h2>
      <p>This Agreement is on a non-monetary, service-exchange basis. No revenue share, rental fee, or commission shall be payable by either Party.</p>
      <h2>6. Term &amp; Termination</h2>
      <p>Valid for <strong>ONE (1) YEAR</strong> from signing, auto-renews unless either Party provides 30 days written notice. Either Party may terminate with <strong>7 days' written notice</strong>.</p>
      <h2>7. Equipment Liability</h2>
      <p>The Venue Partner is responsible for protecting extrravenue's installed hardware from damage, theft, or vandalism and shall bear the cost of repair or replacement resulting from negligence.</p>
      <h2>8. Governing Law</h2>
      <p>Governed by the laws of India. Disputes shall first be resolved amicably within 15 days, failing which through arbitration under the Arbitration and Conciliation Act, 1996.</p>
      <div class="sig-grid">
        <div class="sig-box"><p>For extrravenue<br>Name: ___________________<br>Designation: ____________<br>Date: ${today}</p></div>
        <div class="sig-box"><p>For Venue Partner<br>Name: ${esc(l.owner_name||'___________________')}<br>Business: ${esc(l.business_name)}<br>Date: ${today}</p></div>
      </div>`;

    const agr = document.getElementById('agreement-print');
    agr.innerHTML = `
      <style>
        #agreement-print { font-family: 'Times New Roman', serif; max-width: 750px; margin: 0 auto; padding: 20px 24px; color: #111; line-height: 1.7; font-size: 13pt; }
        #agreement-print h1 { text-align: center; font-size: 16pt; margin-bottom: 6px; }
        #agreement-print .sub { text-align: center; font-size: 11pt; color: #555; margin-bottom: 32px; }
        #agreement-print h2 { font-size: 13pt; margin-top: 24px; margin-bottom: 6px; }
        #agreement-print p { margin-bottom: 10px; text-align: justify; }
        #agreement-print .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; }
        #agreement-print .sig-box p { border-top: 1px solid #333; margin-top: 48px; padding-top: 6px; font-size: 11pt; }
        .print-btn { background: #7b68c8; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 24px; }
        .close-agr { background: none; border: 1.5px solid #ccc; color: #555; padding: 10px 20px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 24px; margin-left: 10px; }
      </style>
      <button class="print-btn" id="agr-print-btn">🖨️ Print / Save PDF</button>
      <button class="close-agr" id="agr-close-btn">Close</button>
      ${_agrPrintHtml}`;

    agr.querySelector('#agr-print-btn').addEventListener('click', openAgreementWindow);
    agr.querySelector('#agr-close-btn').addEventListener('click', () => { agr.style.display = 'none'; });

    agr.style.display = 'block';
    closeDrawer();
    window.scrollTo(0, 0);
  } catch(e) { showToast('Failed to generate agreement', 'error'); }
}

// ── VENUE PARTNER LOGIN ───────────────────────────────────────────
let _vpLeadId = null;

function openVPModal(leadId) {
  _vpLeadId = leadId;
  document.getElementById('vp-email').value = '';
  document.getElementById('vp-pass').value = '';
  document.getElementById('vp-err').style.display = 'none';
  document.getElementById('vp-success').style.display = 'none';
  document.getElementById('vp-modal').style.display = 'flex';
}

function closeVPModal() {
  document.getElementById('vp-modal').style.display = 'none';
  _vpLeadId = null;
}

async function createVPLogin() {
  const email = document.getElementById('vp-email').value.trim();
  const password = document.getElementById('vp-pass').value;
  const errEl = document.getElementById('vp-err');
  const btn = document.getElementById('vp-submit-btn');
  errEl.style.display = 'none';

  if (!email) { errEl.textContent = 'Email daalna zaroori hai'; errEl.style.display = 'block'; return; }
  if (password.length < 8) { errEl.textContent = 'Password minimum 8 characters hona chahiye'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    await api(`/leads/${_vpLeadId}/create-venue-partner`, {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    document.getElementById('vp-success').innerHTML =
      `✅ Account ban gaya!<br><strong>Email:</strong> ${esc(email)}<br><strong>Password:</strong> ${esc(password)}<br><br>Venue partner ko share karo: <strong>extrravenue.com/venue</strong>`;
    document.getElementById('vp-success').style.display = 'block';
    btn.style.display = 'none';
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Account Banao'; }
}
</script>

<!-- VP LOGIN MODAL -->
<div id="vp-modal" style="display:none;position:fixed;inset:0;background:rgba(10,10,30,.5);z-index:600;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);">
