<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shuru Karein — extrravenue</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="canonical" href="https://www.extrravenue.com/get-started.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&family=Libre+Franklin:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f2efe9;
    --surface: #ebe6dd;
    --dark: #1a1714;
    --orange: #e07b39;
    --grad: linear-gradient(135deg,#7b68c8 0%,#e07b39 100%);
    --grad-dark: linear-gradient(135deg,#6457b0 0%,#c46a2e 100%);
    --text: #2e2a26;
    --muted: #7a7570;
    --radius: 16px;
    --wa: #25D366;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1714; --surface: #242018; --dark: #f2efe9;
      --text: #e8e3db; --muted: #9a9590;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1714; --surface: #242018; --dark: #f2efe9;
    --text: #e8e3db; --muted: #9a9590;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Libre Franklin', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px max(16px, env(safe-area-inset-left, 0px));
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  .logo-wrap {
    margin-bottom: 24px;
  }
  .logo-wrap img {
    height: 44px;
    width: auto;
  }

  h1 {
    font-family: 'Magra', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .field-label {
    display: block;
    text-align: left;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .phone-wrap {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .phone-wrap:focus-within {
    border-color: var(--orange);
  }

  .country-code {
    padding: 0 14px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    border-right: 1.5px solid var(--surface);
    height: 52px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
  }

  input[type="tel"] {
    flex: 1;
    border: none;
    background: transparent;
    padding: 0 14px;
    height: 52px;
    font-size: 1.1rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
    min-width: 0;
  }
  input[type="tel"]::placeholder { color: var(--muted); }

  .btn-wa {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 20px;
    padding: 15px 24px;
    border-radius: 12px;
    background: var(--wa);
    color: #fff;
    font-family: 'Magra', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s, box-shadow .2s, transform .1s;
  }
  .btn-wa:hover { background: #1db954; box-shadow: 0 8px 24px -8px rgba(37,211,102,.5); }
  .btn-wa:active { transform: scale(.98); }
  .btn-wa:disabled { background: #aaa; cursor: not-allowed; }

  .wa-icon {
    flex-shrink: 0;
  }

  .note {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .back {
    margin-top: 28px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .back:hover { color: var(--orange); }

  .err {
    color: #e05050;
    font-size: 0.82rem;
    margin-top: 6px;
    text-align: left;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="/assets/logo.png" alt="extrravenue">
  </div>

  <h1>Apna Ad Chalaao</h1>
  <p class="sub">Apna WhatsApp number daalo — hum turant connect karenge aur aapka campaign setup karne mein help karenge.</p>

  <label class="field-label" for="phone">Aapka WhatsApp Number</label>
  <div class="phone-wrap">
    <span class="country-code">🇮🇳 +91</span>
    <input
      type="tel"
      id="phone"
      placeholder="98765 43210"
      maxlength="10"
      inputmode="numeric"
      autocomplete="tel-national"
    >
  </div>
  <div class="err" id="err">Valid 10-digit number daalo</div>

  <button class="btn-wa" id="waBtn" onclick="openWA()">
    <svg class="wa-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    WhatsApp par Connect Karo
  </button>

  <p class="note">Aapka number sirf hamare team ke saath connect karne ke liye use hoga. Koi spam nahi.</p>
</div>

<a class="back" href="/">← Back</a>

<script>
function openWA() {
  const raw = document.getElementById('phone').value.replace(/\D/g,'');
  const err = document.getElementById('err');

  if (raw.length !== 10) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  const businessNum = '919274744022';
  const msg = encodeURIComponent(
    'Hi! Mujhe extrravenue par apna ad chalana hai.\n' +
    'Mera number: +91 ' + raw.slice(0,5) + ' ' + raw.slice(5)
  );
  window.open('https://wa.me/' + businessNum + '?text=' + msg, '_blank');
}

// Allow Enter key
document.getElementById('phone').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') openWA();
});

// Only allow digits
document.getElementById('phone').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g,'').slice(0,10);
  document.getElementById('err').style.display = 'none';
});
</script>
</body>
</html>
