name: Build WebView APKs

on:
  push:
    paths:
      - 'webview-android/**'
      - '.github/workflows/build-webview-apks.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up signing keystore
        working-directory: webview-android/app
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signagecms.keystore
            echo "Using keystore from KEYSTORE_B64 secret"
            ALIAS=$(keytool -list \
              -keystore signagecms.keystore \
              -storepass "signagecms2026" \
              -J-Dfile.encoding=UTF8 2>/dev/null \
              | grep "PrivateKeyEntry\|trustedCertEntry\|SecretKeyEntry" \
              | head -1 | cut -d',' -f1 | tr -d ' ')
            if [ -z "$ALIAS" ]; then
              ALIAS=$(keytool -list \
                -keystore signagecms.keystore \
                -storepass "signagecms2026" \
                -storetype PKCS12 \
                -J-Dfile.encoding=UTF8 2>/dev/null \
                | grep "PrivateKeyEntry" \
                | head -1 | cut -d',' -f1 | tr -d ' ')
            fi
            if [ -z "$ALIAS" ]; then
              echo "⚠️  Could not detect alias — regenerating keystore"
              rm -f signagecms.keystore
            else
              echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
              echo "✅ Alias detected: $ALIAS"
            fi
          fi

          if [ ! -f signagecms.keystore ]; then
            echo "Generating fresh JKS keystore"
            keytool -genkey -v \
              -keystore signagecms.keystore \
              -storetype JKS \
              -alias signagecms \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "signagecms2026" \
              -keypass "signagecms2026" \
              -dname "CN=ExtrraVenue,OU=Android,O=ExtrraVenue,L=India,ST=India,C=IN"
            echo "KEY_ALIAS=signagecms" >> $GITHUB_ENV
            echo ""
            echo "====== COPY THIS AS KEYSTORE_B64 SECRET ======"
            base64 -w 0 signagecms.keystore
            echo ""
            echo "=============================================="
          fi

      - name: Make gradlew executable
        working-directory: webview-android
        run: chmod +x gradlew

      - name: Build all 3 Release APKs
        working-directory: webview-android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: signagecms2026
          KEY_PASS: signagecms2026
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleVenueRelease assembleInspectorRelease assembleAdvertiserRelease --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Kotlin Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep "^e: " | while IFS= read -r line; do
              clean="${line#e: file://}"
              filepath="${clean%%: (*}"
              rest="${clean#*: }"
              echo "FILE: $filepath"
              echo "  $rest"
              echo ""
            done >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "FAILURE:|Caused by:|> Task" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Venue APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-VenuePartner-v1.${{ github.run_number }}
          path: webview-android/app/build/outputs/apk/venue/release/app-venue-release.apk
          retention-days: 90

      - name: Upload Inspector APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Inspector-v1.${{ github.run_number }}
          path: webview-android/app/build/outputs/apk/inspector/release/app-inspector-release.apk
          retention-days: 90

      - name: Upload Advertiser APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Advertiser-v1.${{ github.run_number }}
          path: webview-android/app/build/outputs/apk/advertiser/release/app-advertiser-release.apk
          retention-days: 90

      - name: Create GitHub Release with all 3 APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          TAG="webview-v1.${RUN_NUM}"
          VENUE_APK=webview-android/app/build/outputs/apk/venue/release/app-venue-release.apk
          INSPECTOR_APK=webview-android/app/build/outputs/apk/inspector/release/app-inspector-release.apk
          ADVERTISER_APK=webview-android/app/build/outputs/apk/advertiser/release/app-advertiser-release.apk

          # Rename for clarity in release
          cp "$VENUE_APK" /tmp/EV-VenuePartner-v1.${RUN_NUM}.apk
          cp "$INSPECTOR_APK" /tmp/EV-Inspector-v1.${RUN_NUM}.apk
          cp "$ADVERTISER_APK" /tmp/EV-Advertiser-v1.${RUN_NUM}.apk

          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            "/tmp/EV-VenuePartner-v1.${RUN_NUM}.apk" \
            "/tmp/EV-Inspector-v1.${RUN_NUM}.apk" \
            "/tmp/EV-Advertiser-v1.${RUN_NUM}.apk" \
            --title "ExtrraVenue Apps v1.${RUN_NUM}" \
            --notes "Auto-build #${RUN_NUM} — Venue Partner, Inspector, Advertiser" \
            --repo "$GITHUB_REPOSITORY"

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          VENUE_URL="${BASE}/EV-VenuePartner-v1.${RUN_NUM}.apk"
          INSPECTOR_URL="${BASE}/EV-Inspector-v1.${RUN_NUM}.apk"
          ADVERTISER_URL="${BASE}/EV-Advertiser-v1.${RUN_NUM}.apk"

          printf '## APKs Ready\n| App | Download URL |\n|---|---|\n| Venue Partner | %s |\n| Inspector | %s |\n| Advertiser | %s |\n' \
            "$VENUE_URL" "$INSPECTOR_URL" "$ADVERTISER_URL" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "VENUE_URL=$VENUE_URL" >> $GITHUB_ENV
          echo "INSPECTOR_URL=$INSPECTOR_URL" >> $GITHUB_ENV
          echo "ADVERTISER_URL=$ADVERTISER_URL" >> $GITHUB_ENV
          echo "RUN_NUM=$RUN_NUM" >> $GITHUB_ENV

      - name: Update Railway env vars
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "⚠️ RAILWAY_TOKEN not set, skipping" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          npm install -g @railway/cli --silent
          railway variables set \
            VENUE_APK_VERSION="${RUN_NUM}" \
            VENUE_APK_URL="${VENUE_URL}" \
            INSPECTOR_APK_VERSION="${RUN_NUM}" \
            INSPECTOR_APK_URL="${INSPECTOR_URL}" \
            ADVERTISER_APK_VERSION="${RUN_NUM}" \
            ADVERTISER_APK_URL="${ADVERTISER_URL}"
          echo "✅ Railway vars updated: version=$RUN_NUM" >> $GITHUB_STEP_SUMMARY
