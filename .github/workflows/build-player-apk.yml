name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'
      - '.github/workflows/build-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generate a fresh JKS keystore using keytool (JDK is available above).
      # If KEYSTORE_B64 secret is set, use it instead (consistent signature).
      - name: Set up signing keystore
        working-directory: player-android/app
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signagecms.keystore
            echo "Using keystore from KEYSTORE_B64 secret"
            # Detect actual alias (handles both JKS and PKCS12 formats)
            ALIAS=$(keytool -list \
              -keystore signagecms.keystore \
              -storepass "signagecms2026" \
              -J-Dfile.encoding=UTF8 2>/dev/null \
              | grep "PrivateKeyEntry\|trustedCertEntry\|SecretKeyEntry" \
              | head -1 | cut -d',' -f1 | tr -d ' ')
            if [ -z "$ALIAS" ]; then
              # PKCS12 alias detection (different format)
              ALIAS=$(keytool -list \
                -keystore signagecms.keystore \
                -storepass "signagecms2026" \
                -storetype PKCS12 \
                -J-Dfile.encoding=UTF8 2>/dev/null \
                | grep "PrivateKeyEntry" \
                | head -1 | cut -d',' -f1 | tr -d ' ')
            fi
            if [ -z "$ALIAS" ]; then
              echo "⚠️  Could not detect alias from secret keystore — regenerating with keytool"
              rm -f signagecms.keystore
            else
              echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
              echo "✅ Alias detected: $ALIAS"
            fi
          fi

          if [ ! -f signagecms.keystore ]; then
            echo "Generating fresh JKS keystore with keytool"
            keytool -genkey -v \
              -keystore signagecms.keystore \
              -storetype JKS \
              -alias signagecms \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "signagecms2026" \
              -keypass  "signagecms2026" \
              -dname "CN=SignageCMS Player,OU=Android,O=SignageCMS,L=India,ST=India,C=IN"
            echo "KEY_ALIAS=signagecms" >> $GITHUB_ENV
            echo ""
            echo "====== COPY THIS AS KEYSTORE_B64 SECRET ======"
            base64 -w 0 signagecms.keystore
            echo ""
            echo "=============================================="
          fi

      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: player-android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: signagecms2026
          KEY_PASS: signagecms2026
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleRelease --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Kotlin Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Print each Kotlin error line split into path + message parts
            echo "$BUILD_OUTPUT" | grep "^e: " | while IFS= read -r line; do
              # Strip "e: file://" prefix and split into components
              clean="${line#e: file://}"
              filepath="${clean%%: (*}"
              rest="${clean#*: }"
              echo "FILE: $filepath"
              echo "  $rest"
              echo ""
            done >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "FAILURE:|Caused by:|> Task" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-v1.${{ github.run_number }}
          path: player-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload APK to Cloudinary
        id: cloudinary
        env:
          CLD_CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLD_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLD_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          APK=player-android/app/build/outputs/apk/release/app-release.apk
          # Cloudinary blocks .apk — upload as .zip (AppUpdater downloads and renames back to .apk)
          cp "$APK" /tmp/app-release.zip

          TIMESTAMP=$(date +%s)
          PUBLIC_ID="signagecms-player-v1.${RUN_NUM}"

          SIGNATURE=$(printf "public_id=%s&timestamp=%s%s" "$PUBLIC_ID" "$TIMESTAMP" "$CLD_SECRET" | openssl dgst -sha1 -binary | xxd -p | tr -d '\n')

          RESPONSE=$(curl -s -X POST \
            "https://api.cloudinary.com/v1_1/${CLD_CLOUD}/raw/upload" \
            -F "file=@/tmp/app-release.zip" \
            -F "public_id=${PUBLIC_ID}" \
            -F "api_key=${CLD_KEY}" \
            -F "timestamp=${TIMESTAMP}" \
            -F "signature=${SIGNATURE}")

          echo "Cloudinary response: $RESPONSE"

          APK_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('secure_url',''))" 2>/dev/null)

          if [ -z "$APK_URL" ]; then
            echo "ERROR: $RESPONSE"
            exit 1
          fi

          echo "SUCCESS: $APK_URL"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          printf '## APK Ready\n```\nAPK_VERSION_CODE=%s\nAPK_DOWNLOAD_URL=%s\n```\n' "$RUN_NUM" "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
