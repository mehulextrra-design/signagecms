name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Keystore strategy (priority order) ──────────────────────────────
      # 1. If KEYSTORE_B64 secret is set → always use it (most reliable)
      # 2. Else restore from Actions cache (persists across runs on same branch)
      # 3. Else generate new keystore + save to cache for future runs
      #
      # Result: same signature every build once keystore is established.
      # To reset: delete the cache key "signagecms-keystore" in GitHub Actions UI.
      - name: Restore keystore from cache
        if: ${{ secrets.KEYSTORE_B64 == '' }}
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: player-android/app/signagecms.keystore
          key: signagecms-keystore-v1

      - name: Set up signing keystore
        working-directory: player-android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/signagecms.keystore
            echo "✅ Using keystore from KEYSTORE_B64 secret"

          elif [ -f "app/signagecms.keystore" ]; then
            echo "✅ Using cached keystore (same signature as previous builds)"

          else
            echo "⚠️  Generating new keystore (first time on this branch)"
            keytool -genkey -v \
              -keystore app/signagecms.keystore \
              -alias signagecms \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "signagecms2026" \
              -keypass  "signagecms2026" \
              -dname "CN=SignageCMS Player,OU=Android,O=SignageCMS,L=India,ST=India,C=IN"

            echo ""
            echo "──────────────────────────────────────────────────────────────"
            echo "📋 IMPORTANT — to keep this keystore forever, add this as a"
            echo "   GitHub secret named KEYSTORE_B64 (Settings → Secrets → Actions):"
            echo "──────────────────────────────────────────────────────────────"
            base64 -w 0 app/signagecms.keystore
            echo ""
            echo "──────────────────────────────────────────────────────────────"
          fi

      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: player-android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: signagecms2026
          KEY_ALIAS: signagecms
          KEY_PASS: signagecms2026
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleRelease --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "^e: |error:|FAILURE:|Caused by:|> " | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-v1.${{ github.run_number }}
          path: player-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: APK Info
        working-directory: player-android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## ✅ APK Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** SignageCMS-Player-v1.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** 1.${{ github.run_number }} (versionCode ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** Release (TV compatible, kiosk mode)" >> $GITHUB_STEP_SUMMARY
