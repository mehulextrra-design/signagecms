name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'   # Sirf player code change hone pe trigger
  workflow_dispatch:           # Manual trigger bhi (GitHub UI se)

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 setup (Android build ke liye)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle cache (faster builds)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. gradlew executable permissions (Linux needs this)
      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      # 5. Build Debug APK
      - name: Build Debug APK
        working-directory: player-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Upload APK as artifact (90 days tak available)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-Debug-${{ github.run_number }}
          path: player-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 7. Build summary
      - name: APK Info
        working-directory: player-android
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## APK Build Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Actions → Artifacts** section above ⬆️" >> $GITHUB_STEP_SUMMARY
