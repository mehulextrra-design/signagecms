name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generate a fresh JKS keystore using keytool (JDK is available above).
      # If KEYSTORE_B64 secret is set, use it instead (consistent signature).
      - name: Set up signing keystore
        working-directory: player-android/app
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signagecms.keystore
            echo "Using keystore from KEYSTORE_B64 secret"
            # Detect actual alias (handles both JKS and PKCS12 formats)
            ALIAS=$(keytool -list \
              -keystore signagecms.keystore \
              -storepass "signagecms2026" \
              -J-Dfile.encoding=UTF8 2>/dev/null \
              | grep "PrivateKeyEntry\|trustedCertEntry\|SecretKeyEntry" \
              | head -1 | cut -d',' -f1 | tr -d ' ')
            if [ -z "$ALIAS" ]; then
              # PKCS12 alias detection (different format)
              ALIAS=$(keytool -list \
                -keystore signagecms.keystore \
                -storepass "signagecms2026" \
                -storetype PKCS12 \
                -J-Dfile.encoding=UTF8 2>/dev/null \
                | grep "PrivateKeyEntry" \
                | head -1 | cut -d',' -f1 | tr -d ' ')
            fi
            if [ -z "$ALIAS" ]; then
              echo "⚠️  Could not detect alias from secret keystore — regenerating with keytool"
              rm -f signagecms.keystore
            else
              echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
              echo "✅ Alias detected: $ALIAS"
            fi
          fi

          if [ ! -f signagecms.keystore ]; then
            echo "Generating fresh JKS keystore with keytool"
            keytool -genkey -v \
              -keystore signagecms.keystore \
              -storetype JKS \
              -alias signagecms \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "signagecms2026" \
              -keypass  "signagecms2026" \
              -dname "CN=SignageCMS Player,OU=Android,O=SignageCMS,L=India,ST=India,C=IN"
            echo "KEY_ALIAS=signagecms" >> $GITHUB_ENV
            echo ""
            echo "====== COPY THIS AS KEYSTORE_B64 SECRET ======"
            base64 -w 0 signagecms.keystore
            echo ""
            echo "=============================================="
          fi

      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: player-android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: signagecms2026
          KEY_PASS: signagecms2026
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleRelease --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Kotlin Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Print each Kotlin error line split into path + message parts
            echo "$BUILD_OUTPUT" | grep "^e: " | while IFS= read -r line; do
              # Strip "e: file://" prefix and split into components
              clean="${line#e: file://}"
              filepath="${clean%%: (*}"
              rest="${clean#*: }"
              echo "FILE: $filepath"
              echo "  $rest"
              echo ""
            done >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "FAILURE:|Caused by:|> Task" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-v1.${{ github.run_number }}
          path: player-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v1.${{ github.run_number }}`;
            const fs = require('fs');
            const apkData = fs.readFileSync('player-android/app/build/outputs/apk/release/app-release.apk');

            // Create or update release
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.data.id });
              await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
            } catch (e) {}

            release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `SignageCMS Player ${tag}`,
              body: `Auto-built from commit ${{ github.sha }}`,
              make_latest: 'true'
            });

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'app-release.apk',
              data: apkData
            });

            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/app-release.apk`;
            core.summary.addHeading('✅ APK Build Success');
            core.summary.addList([
              `Tag: ${tag}`,
              `Download: ${url}`,
              `Set Railway env: APK_VERSION_CODE=${{ github.run_number }}`,
              `Set Railway env: APK_DOWNLOAD_URL=${url}`
            ]);
            await core.summary.write();
            console.log(`\n✅ Release: ${url}\n`);
