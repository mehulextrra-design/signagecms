name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: player-android
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "^e: |error:|FAILURE:|Caused by:|> " | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-Debug-${{ github.run_number }}
          path: player-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: APK Info
        working-directory: player-android
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## ✅ APK Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
