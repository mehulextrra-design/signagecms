name: Build Player APK

on:
  push:
    paths:
      - 'player-android/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore keystore from KEYSTORE_B64 secret
        working-directory: player-android/app
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signagecms.keystore
          echo "✅ Keystore restored ($(wc -c < signagecms.keystore) bytes)"

      - name: Make gradlew executable
        working-directory: player-android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: player-android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: signagecms2026
          KEY_ALIAS: signagecms
          KEY_PASS: signagecms2026
        run: |
          set +e
          BUILD_OUTPUT=$(./gradlew assembleRelease --no-daemon --stacktrace 2>&1)
          EXIT_CODE=$?
          echo "$BUILD_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$BUILD_OUTPUT" | grep -E "^e: |error:|FAILURE:|Caused by:|> " | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageCMS-Player-v1.${{ github.run_number }}
          path: player-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: APK Info
        working-directory: player-android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## ✅ APK Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** SignageCMS-Player-v1.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** 1.${{ github.run_number }} (versionCode ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** Release — PKCS12 signed, TV kiosk mode" >> $GITHUB_STEP_SUMMARY
